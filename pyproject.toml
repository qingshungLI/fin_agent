[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoalpha-harness"
version = "0.1.0"
description = "Auditable, falsification-driven factor research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "pandas>=2.2,<3", "pyarrow>=17", "scipy>=1.13", "scikit-learn>=1.5", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.8", "PyYAML>=6.0"]

[project.optional-dependencies]
rqdata = ["rqdatac==3.5.6.1"]
test = ["pytest>=8", "ruff>=0.9"]
backtest = ["rqalpha==6.3.0", "duckdb>=1.4,<2"]
bayes = ["pymc>=5.20,<5.21", "arviz>=0.20,<0.22", "matplotlib>=3.8,<3.11", "numpy<2"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
